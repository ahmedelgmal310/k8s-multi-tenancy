# A curl pod in a non-tenant namespace (deployed by the platform). Used to
# show that tenant ingress is closed to everything outside the tenant, not
# only to other tenants.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: platform-probe
  labels:
    app.kubernetes.io/name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: docker.io/curlimages/curl:8.22.0@sha256:43366cd60f226c7655181a0f7e85c468a41d182fdd2dc2c1c3b872a2b9d05d7a
          command: [sleep, "86400"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
