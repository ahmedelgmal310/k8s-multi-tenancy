# Denied: a tenant admin adding a NetworkPolicy that opens its namespace to
# everything (NetworkPolicies are additive, so this would undo default-deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: conf-allow-all
  namespace: team-a-backend
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - {}
  egress:
    - {}
