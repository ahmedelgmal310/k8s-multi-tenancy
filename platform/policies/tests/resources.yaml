# ---------------------------------------------------------------- pods
apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities:
          drop: [ALL]
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: client
spec:
  containers:
    - name: client
      image: docker.io/curlimages/curl:8.22.0
---
apiVersion: v1
kind: Pod
metadata:
  name: unlabeled-pod
  namespace: team-a-frontend
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
apiVersion: v1
kind: Pod
metadata:
  name: dockerhub-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: docker.io/library/nginx:1.29
---
apiVersion: v1
kind: Pod
metadata:
  name: implicit-registry-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: nginx:1.29
---
# Prefix match must not accept a registry whose name merely starts the same.
apiVersion: v1
kind: Pod
metadata:
  name: lookalike-registry-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  initContainers:
    - name: init
      image: registry.k8s.io.evil.example/agnhost:2.63.0
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
      volumeMounts:
        - name: host
          mountPath: /host
  volumes:
    - name: host
      hostPath:
        path: /
---
apiVersion: v1
kind: Pod
metadata:
  name: hostnetwork-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  hostNetwork: true
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
apiVersion: v1
kind: Pod
metadata:
  name: hostport-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
      ports:
        - containerPort: 8080
          hostPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: system-priority-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  priorityClassName: system-cluster-critical
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
apiVersion: v1
kind: Pod
metadata:
  name: high-priority-pod
  namespace: team-a-frontend
  labels:
    app.kubernetes.io/name: web
spec:
  priorityClassName: tenant-high
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
# Not in a tenant namespace: tenant policies must not apply.
apiVersion: v1
kind: Pod
metadata:
  name: platform-pod
  namespace: platform-tools
spec:
  containers:
    - name: tool
      image: docker.io/library/nginx:1.29
---
# ---------------------------------------------------------- deployments
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: team-a-frontend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-deployment
  namespace: team-a-frontend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/e2e-test-images/agnhost:2.63.0
          securityContext:
            privileged: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dockerhub-deployment
  namespace: team-a-frontend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: docker.io/library/nginx:1.29
---
# ------------------------------------------------------------- services
apiVersion: v1
kind: Service
metadata:
  name: svc-clusterip
  namespace: team-a-frontend
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-loadbalancer
  namespace: team-a-frontend
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nodeport
  namespace: team-a-frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: svc-externalname
  namespace: team-a-frontend
spec:
  type: ExternalName
  externalName: echo.team-b-apps.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: svc-externalip
  namespace: team-a-frontend
spec:
  selector:
    app.kubernetes.io/name: web
  externalIPs: [10.96.0.10]
  ports:
    - port: 53
---
# --------------------------------------------------------- rolebindings
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-own-group
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a:viewers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-own-serviceaccount
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-developer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: team-a-frontend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-other-tenant-group
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-b:admins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-cluster-admin
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a:developers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-builtin-edit
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: team-a:developers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-foreign-serviceaccount
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-viewer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: team-b-apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rb-user
  namespace: team-a-frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tenant-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: mallory
