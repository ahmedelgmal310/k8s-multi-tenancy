# Extra permissions for Kyverno's background controller, which creates the
# per-tenant objects. The chart already lets it create RoleBindings,
# ResourceQuotas, LimitRanges and NetworkPolicies. Creating a RoleBinding to a
# ClusterRole additionally requires either holding every permission in that
# role or the "bind" verb on it (RBAC escalation prevention), so the controller
# gets "bind" on exactly the three tenant roles and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:tenant-onboarding
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [tenant-admin, tenant-developer, tenant-viewer]
    verbs: [bind]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
